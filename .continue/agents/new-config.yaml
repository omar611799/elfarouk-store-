name: Local Ollama Config
version: 1.0.0
schema: v1

models:
  - name: gemma4
    provider: ollama
    model: gemma4

context:
  - provider: code
  - provider: docs
  - provider: diff
  - provider: terminal

slashCommands:
  - name: edit
    description: Edit selected code

  - name: comment
    description: Write comments for the selected code

  - name: share
    description: Export the current chat session

  - name: commit
    description: Generate a git commit message