name: 📱 WhatsApp Maintenance Reminders

on:
  # يعمل كل يوم الساعة 7 صباحاً UTC = 9 صباحاً بتوقيت مصر/السعودية
  schedule:
    - cron: '0 7 * * *'

  # يمكنك تشغيله يدوياً للاختبار
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    name: إرسال تذكيرات الصيانة

    steps:
      - name: 📥 تحميل الكود
        uses: actions/checkout@v4

      - name: 🟢 إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: 📦 تثبيت المكتبات
        run: npm install
        working-directory: scripts

      - name: 📱 إرسال تذكيرات الواتساب
        run: node send-reminders.js
        working-directory: scripts
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
